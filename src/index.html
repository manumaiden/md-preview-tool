<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markdown Preview Tool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Markdown Preview Tool <span id="version-badge" class="version-badge"></span></h1>
    <p class="subtitle">Write in markdown, copy the formatted result into the ticketing tool</p>
  </header>
  <main class="panels">
    <section class="panel">
      <h2>Markdown</h2>
      <div class="snippet-buttons">
        <button type="button" class="snippet-button" data-snippet="signature">Signature</button>
        <button type="button" class="snippet-button" data-snippet="template-1">Template 1</button>
        <button type="button" class="snippet-button" data-snippet="template-2">Template 2</button>
        <button type="button" class="snippet-button" data-snippet="template-3">Template 3</button>
        <button type="button" id="clear-button" class="clear-button">Clear</button>
      </div>
      <textarea id="markdown-input" placeholder="Write your update here in markdown..."></textarea>
    </section>
    <section class="panel">
      <h2>Preview</h2>
      <div id="preview" contenteditable="true"></div>
      <button id="copy-button">Copy formatted</button>
      <p id="copy-status" role="status"></p>
    </section>
  </main>
  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
